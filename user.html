<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profil Utilisateur</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.css" rel="stylesheet" type="text/css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-base-200 p-8">
        <div class="container mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- SECTION GAUCHE -->
                <div class="md:col-span-1 space-y-6">

                    <!-- Carte Profil -->
                    <div class="card shadow-xl bg-base-100">
                        <div class="card-body items-center text-center">
                            <div class="avatar">
                                <div class="w-32 rounded-full">
                                    <img src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp" alt="Photo utilisateur">
                                </div>
                            </div>
                            <h2 class="card-title mt-4">Pseudo du Joueur</h2>
                            <p class="text-sm opacity-70">Membre depuis 2023</p>
                        </div>
                    </div>

                    <!-- Participations aux événements -->
                    <div class="card shadow-xl bg-base-100">
                        <div class="card-body">
                            <h3 class="card-title">Participations aux LAN</h3>

                            <ul class="mt-3 space-y-2">
                                <li class="badge badge-primary badge-lg w-full justify-between flex">
                                    LAN Winter 2025
                                    <span class="badge badge-secondary">✔</span>
                                </li>

                                <li class="badge badge-primary badge-lg w-full justify-between flex">
                                    Summer LAN 2024
                                    <span class="badge badge-secondary">✔</span>
                                </li>

                                <li class="badge badge-outline badge-lg w-full justify-between flex">
                                    Spring LAN 2026
                                    <span class="badge badge-warning">Prochainement</span>
                                </li>
                            </ul>

                        </div>
                    </div>

                </div>

                <!-- SECTION DROITE -->
                <div class="md:col-span-2">
                    <div class="card shadow-xl bg-base-100">
                        <div class="card-body">

                            <h2 class="card-title text-2xl mb-4">Informations utilisateur</h2>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                <div class="space-y-1">
                                    <p class="text-sm font-semibold opacity-70">Prénom</p>
                                    <p class="p-3 rounded-lg bg-base-200"></p>
                                </div>

                                <div class="space-y-1">
                                    <p class="text-sm font-semibold opacity-70">Nom</p>
                                    <p class="p-3 rounded-lg bg-base-200"></p>
                                </div>

                                <div class="space-y-1 md:col-span-2">
                                    <p class="text-sm font-semibold opacity-70">Email</p>
                                    <p class="p-3 rounded-lg bg-base-200"></p>
                                </div>

                                <div class="space-y-1 md:col-span-2">
                                    <p class="text-sm font-semibold opacity-70">Biographie</p>
                                    <p class="p-3 rounded-lg bg-base-200">
                                        Passionné d’esport, de LAN parties et d'organisation d'événements gaming.
                                    </p>
                                </div>

                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
