<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LAN logIn</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/CSS/app.css">
</head>
    <body class="flex items-center justify-center min-h-screen">
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-lg border p-8">
            <legend class="fieldset-legend text-2xl">Login</legend>

            <label class="label text-lg mt-2">Email</label>
            <input type="email" class="input w-full text-lg" placeholder="Email" />

            <label class="label text-lg mt-6">Password</label>
            <input type="password" class="input w-full text-lg" placeholder="Password" />

            <button class="btn btn-neutral mt-8 text-lg">Login</button>
        </fieldset>
    </body>
</html>
